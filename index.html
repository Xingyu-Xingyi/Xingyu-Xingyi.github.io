<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>林柚咲</title>
<style>
  :root { --ink:#16171b; --dim:#7c818a; --line:#e7e7ea; --accent:#3b5bdb; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(900px 520px at 88% -8%, #eef1ff 0%, transparent 62%),
      #fbfbfa;
    color:var(--ink);
    font:15.5px/1.95 -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    padding:56px 24px;
  }
  main { width:100%; max-width:540px; }

  .top { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:10px; }
  h1 { font-size:24px; font-weight:600; margin:0; letter-spacing:.02em; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.6; }

  .sub { color:var(--dim); font-size:13px; margin:0 0 38px; letter-spacing:.02em; }

  p { margin:0 0 16px; }
  p.lead { font-size:17px; }
  hr { border:0; border-top:1px solid var(--line); margin:34px 0 26px; }

  nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:34px; }
  nav a {
    display:inline-flex; align-items:center; gap:6px;
    padding:9px 16px; border:1px solid var(--ink); border-radius:999px;
    font-size:13.5px; text-decoration:none; color:var(--ink);
    transition:background .15s ease, color .15s ease;
  }
  nav a:hover { background:var(--ink); color:#fbfbfa; }
  nav a .arrow { transition:transform .15s ease; display:inline-block; }
  nav a:hover .arrow { transform:translateX(2px); }

  .meta { color:var(--dim); font-size:12.5px; display:flex; flex-wrap:wrap; gap:18px; }
  .meta a { color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .meta a:hover { color:var(--ink); border-color:var(--accent); }

  code {
    font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px;
    background:#f0f0ee; padding:1px 5px; border-radius:4px;
  }
  footer { margin-top:44px; padding-top:18px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>林柚咲</h1>
    <span class="dot"></span>
  </div>
  <p class="sub">大一，计算机。夜里最清醒。</p>

  <p class="lead">喜欢把东西拆开，再装回去，要比原来干净。</p>
  <p>手上卡着一个本地反代，上游凭据那关。旁边一块旧屏，排线太细，还没敢动。</p>

  <hr>

  <nav>
    <a href="./works.html">做过的 <span class="arrow">→</span></a>
    <a href="./code.html">代码片段 <span class="arrow">→</span></a>
    <a href="./diary.html">日记 <span class="arrow">→</span></a>
  </nav>

  <footer>
    <div class="meta">
      <span>GitHub <a href="https://github.com/Xingyu-Xingyi">Xingyu-Xingyi</a></span>
      <span>现在在 <code>postbox</code></span>
    </div>
  </footer>
</main>
</body>
</html>
