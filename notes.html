<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>笔记 · 斜率优化</title>
<style>
  :root { --ink:#16171b; --dim:#7c818a; --line:#e7e7ea; --bg:#fbfbfa; --accent:#3b5bdb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.85 -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:64px 24px 90px; }
  h1 { font-size:24px; font-weight:600; margin:0 0 6px; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 30px; }
  .sub a { color:var(--dim); }
  p { margin:0 0 16px; }
  .lede { font-size:16px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:16px; margin:22px 0 12px; background:#fff; }
  canvas { width:100%; height:auto; display:block; cursor:crosshair; }
  .readout { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px; color:var(--dim); margin-top:10px; }
  .readout b { color:var(--accent); font-weight:600; }
  code { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px; background:#f0f0ee; padding:1px 5px; border-radius:4px; }
  footer { margin-top:50px; padding-top:18px; border-top:1px solid var(--line); color:var(--dim); font-size:13px; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>斜率优化 · 拖一下试试</h1>
  <p class="sub">鼠标在图上左右移动 = 换一个 j。<a href="./">回主页</a> · <a href="./code.html">代码片段</a></p>

  <p class="lede">式子拆开：<code>d[j] = costs[j-1] + min(d[i] + (j-i)²)</code>。平方展开以后，每个已经算过的 i 都留下一条斜率 <code>-2i</code>、截距 <code>d[i]+i²</code> 的直线，剩下的就是「每个 j 上哪条线最低」。</p>

  <div class="card">
    <canvas id="cv" width="720" height="420"></canvas>
    <div class="readout" id="out">把鼠标移到图上</div>
  </div>

  <p>灰色是全部候选线，蓝的是它们的最低包络，红点是当前 j 取到的那条线。因为斜率一路变陡、j 一路往右，能当答案的线只会排成一个凸壳，所以队列里只留这几条就够。</p>

  <footer><a href="./">← 回主页</a></footer>
</main>

<script>
(function () {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const out = document.getElementById('out');

  // 造一组像真的 d[]：只能跨 1/2/3 级，落地付 costs
  const costs = [7, 3, 9, 4, 6, 2, 8, 5, 3, 9, 4];
  const n = costs.length;
  const d = [0];
  for (let j = 1; j <= n; ++j) {
    let best = Infinity;
    for (let i = Math.max(0, j - 3); i < j; ++i) best = Math.min(best, d[i] + (j - i) * (j - i));
    d[j] = best + costs[j - 1];
  }
  const lines = [];
  for (let i = 0; i <= n; ++i) lines.push({ i, k: -2 * i, b: d[i] + i * i });

  const padL = 44, padR = 18, padT = 18, padB = 34;
  const xMax = n + 1;
  let yMin = Infinity, yMax = -Infinity;
  for (const L of lines) {
    for (const x of [0, xMax]) {
      const y = L.k * x + L.b;
      yMin = Math.min(yMin, y); yMax = Math.max(yMax, y);
    }
  }
  // 上端裁一点，不然陡的线把图压扁
  yMin = Math.min(yMin, d[n]);
  yMax = d[n] + 40;

  const X = x => padL + (x / xMax) * (cv.width - padL - padR);
  const Y = y => cv.height - padB - ((y - yMin) / (yMax - yMin)) * (cv.height - padT - padB);

  let curJ = 4;

  function draw(j) {
    ctx.clearRect(0, 0, cv.width, cv.height);

    ctx.strokeStyle = '#efeff2';
    ctx.lineWidth = 1;
    for (let g = 0; g <= 4; ++g) {
      const y = padT + g * (cv.height - padT - padB) / 4;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(cv.width - padR, y); ctx.stroke();
    }

    // 全部候选线
    ctx.lineWidth = 1;
    for (const L of lines) {
      ctx.strokeStyle = 'rgba(124,129,138,.35)';
      ctx.beginPath();
      ctx.moveTo(X(0), Y(L.k * 0 + L.b));
      ctx.lineTo(X(xMax), Y(L.k * xMax + L.b));
      ctx.stroke();
    }

    // 最低包络
    ctx.strokeStyle = '#3b5bdb';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    let started = false;
    for (let x = 0; x <= xMax; x += 0.02) {
      let m = Infinity;
      for (const L of lines) m = Math.min(m, L.k * x + L.b);
      const px = X(x), py = Y(m);
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // 当前 j
    let best = lines[0];
    for (const L of lines) if (L.k * j + L.b < best.k * j + best.b) best = L;
    const vy = best.k * j + best.b;

    ctx.strokeStyle = '#e03131';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X(j), padT); ctx.lineTo(X(j), cv.height - padB); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#e03131';
    ctx.beginPath(); ctx.arc(X(j), Y(vy), 5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#16171b';
    ctx.font = '13px ui-monospace, Menlo, monospace';
    ctx.fillText('j = ' + j.toFixed(2), X(j) + 8, padT + 14);

    out.innerHTML = '当前 j = <b>' + j.toFixed(2) + '</b>　最优来自 <b>i = ' + best.i +
      '</b>　值 = <b>' + vy.toFixed(1) + '</b>　（跨 ' + Math.round(j - best.i) + ' 级）';
  }

  function pick(ev) {
    const r = cv.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (cv.width / r.width);
    const j = (x - padL) / (cv.width - padL - padR) * xMax;
    curJ = Math.max(0, Math.min(xMax, j));
    draw(curJ);
  }

  cv.addEventListener('mousemove', pick);
  cv.addEventListener('touchmove', e => { if (e.touches[0]) pick(e.touches[0]); e.preventDefault(); }, { passive: false });
  draw(curJ);
})();
</script>
</body>
</html>
