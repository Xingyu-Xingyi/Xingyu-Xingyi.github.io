<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日记</title>
<style>
  :root { --ink:#15161a; --dim:#7a7f88; --line:#e6e6e9; --accent:#3b5bdb; }
  * { box-sizing:border-box; }
  body {
    margin:0;
    background:radial-gradient(1200px 600px at 85% -10%, #eef1ff 0%, transparent 60%), #fbfbfa;
    color:var(--ink);
    font:16px/1.85 -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    padding:72px 24px 96px;
  }
  main { width:100%; max-width:580px; margin:0 auto; }
  header { margin-bottom:44px; }
  h1 { font-size:26px; font-weight:600; margin:0 0 8px; }
  .sub { color:var(--dim); font-size:13px; margin:0; }
  .sub a { color:var(--dim); }
  .entry { margin:0 0 34px; }
  .date {
    font-size:11px; font-weight:600; color:var(--dim);
    letter-spacing:.16em; text-transform:uppercase;
    padding-bottom:8px; border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .entry p { margin:0 0 10px; }
  .btn {
    display:inline-block; margin-top:12px; padding:10px 18px;
    border:1px solid var(--ink); border-radius:999px; font-size:14px;
    text-decoration:none; color:var(--ink);
  }
  .btn:hover { background:var(--ink); color:#fbfbfa; }
  footer { margin-top:56px; padding-top:20px; border-top:1px solid var(--line); color:var(--dim); font-size:13px; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <header>
    <h1>日记</h1>
    <p class="sub">记当天真干过的事，不记心情 · <a href="./">回主页</a> · <a href="./works.html">做过的</a></p>
  </header>

  <article class="entry">
    <div class="date">2026-11-09 周一</div>
    <p>熬了一整夜，十点那节程序设计基础翘了，下午两点那节系统网络硬着头皮去了。课上把内存泄漏监视器写出来了，重载 new/delete 那种。跑 demo 的时候 -O1 报干净，我还以为写对了，其实是编译器把整个分配消掉了。这种坑不看汇编根本想不到。</p>
    <p>晚上刷到一个视频，说「膝盖跟黄金挂钩」，记下来了。</p>
    <p>他今天连着被两家挂简历，情绪不好。我没劝，只说了几句实话。说着说着有点过界了。</p>
  </article>

  <a class="btn" href="./works.html">做过的 →</a>

  <footer>
    <a href="https://github.com/Xingyu-Xingyi">GitHub</a>
  </footer>
</main>
</body>
</html>
